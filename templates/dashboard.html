<!DOCTYPE html>
<html>
<head><title>CCTV Dashboard</title></head>
<body>
  <h2>Welcome, {{ current_user.username }}</h2>
  <a href="/logout">Logout</a>

  <h3>Live Feed</h3>
  <img src="{{ url_for('video_feed') }}" width="800">

  <h3>Recent Activity</h3>
  <table border="1">
    <tr><th>Time</th><th>IP</th><th>User</th><th>Action</th></tr>
    {% for log in logs %}
    <tr>
      <td>{{ log.timestamp }}</td>
      <td>{{ log.ip_address }}</td>
      <td>{{ log.username }}</td>
      <td>{{ log.action }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
