<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CCTV System{% endblock %}</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#050505;
            font-family:'Inter',sans-serif;
            color:white;
            overflow-x:hidden;
            position:relative;
            padding:30px;
        }

        /* Background Glow */
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:
            radial-gradient(circle at 20% 30%, rgba(0,255,170,0.15), transparent 35%),
            radial-gradient(circle at 80% 70%, rgba(0,255,170,0.08), transparent 35%);
            z-index:0;
        }

        /* Grid Overlay */
        body::after{
            content:"";
            position:fixed;
            inset:0;
            background-image:
            linear-gradient(rgba(0,255,170,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,255,170,0.05) 1px, transparent 1px);
            background-size:45px 45px;
            z-index:0;
        }

        .container{
            max-width:1200px;
            margin:auto;
            position:relative;
            z-index:2;
        }

        .card{
            background:rgba(0,0,0,0.72);
            backdrop-filter:blur(14px);
            border:1px solid rgba(0,255,170,0.3);
            border-radius:24px;
            padding:25px;
            box-shadow:
            0 0 20px rgba(0,255,170,0.08),
            0 0 40px rgba(0,255,170,0.04);
            margin-bottom:20px;
        }

        h1,h2,h3{
            font-family:'Orbitron',sans-serif;
            color:#00ffb3;
            margin-bottom:15px;
        }

        .nav{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:25px;
        }

        .nav a{
            color:#00ffb3;
            text-decoration:none;
            padding:10px 18px;
            border-radius:12px;
            border:1px solid rgba(0,255,170,0.2);
            background:rgba(255,255,255,0.03);
            transition:.3s;
        }

        .nav a:hover{
            background:rgba(0,255,170,0.08);
            box-shadow:0 0 12px rgba(0,255,170,0.15);
        }

        button{
            padding:12px 22px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#00d97e,#00ffb3);
            font-family:'Orbitron';
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 0 20px rgba(0,255,170,0.25);
        }

        input{
            width:100%;
            padding:14px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.03);
            color:white;
            outline:none;
            margin-bottom:15px;
        }

        input:focus{
            border-color:#00ffb3;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            padding:14px;
            text-align:left;
            color:#00ffb3;
            border-bottom:1px solid rgba(0,255,170,0.2);
        }

        td{
            padding:14px;
            border-bottom:1px solid rgba(255,255,255,0.05);
        }

        tr:hover{
            background:rgba(0,255,170,0.04);
        }

        @media(max-width:768px){
            body{
                padding:15px;
            }

            .nav{
                flex-direction:column;
            }

            .nav a{
                text-align:center;
            }
        }

    </style>
</head>
<body>

<div class="container">

    <!-- Navigation -->
    <div class="nav">
        <a href="/">
            <i class="fa-solid fa-house"></i> Dashboard
        </a>
        <a href="/logs">
            <i class="fa-solid fa-clock-rotate-left"></i> Logs
        </a>
        <a href="/logout">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>

    <!-- Page Content -->
    {% block content %}
    <div class="card">
        <h1>Page Title</h1>
        <p>Your content goes here.</p>
    </div>
    {% endblock %}

</div>

</body>
</html>
