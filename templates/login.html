<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
  margin:0;
  background:#050a05;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:#d6ffd6;
}

.box{
  width:380px;
  background:#0d140d;
  padding:30px;
  border-radius:12px;
  border:1px solid #1a2a1a;
  box-shadow:0 0 20px rgba(0,255,102,0.1);
}

h2{
  text-align:center;
  color:#00ff66;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  background:#0a120a;
  border:1px solid #1a2a1a;
  color:white;
  border-radius:6px;
}

button{
  width:100%;
  padding:12px;
  background:#00ff66;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00cc55;
}

a{
  color:#00ff66;
}
</style>

</head>

<body>

<div class="box">
  <h2>🔐 CCTV LOGIN</h2>

  <form method="POST" action="/login">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button>LOGIN</button>
  </form>

  <p style="text-align:center;">No account? <a href="/signup">Sign up</a></p>
</div>

</body>
</html>
