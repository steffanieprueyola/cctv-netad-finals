<!DOCTYPE html>
<html lang="en">
<head>
  <title>User CCTV Dashboard</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSRF Token -->
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      min-height:100vh;
      background:#050505;
      font-family:'Inter',sans-serif;
      color:white;
      overflow-x:hidden;
      position:relative;
      padding:30px;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,255,170,0.15), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(0,255,170,0.08), transparent 35%);
      z-index:0;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(0,255,170,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,170,0.05) 1px, transparent 1px);
      background-size:45px 45px;
      z-index:0;
    }

    .container{
      max-width:1300px;
      margin:auto;
      position:relative;
      z-index:2;
    }

    .header-card{
      background:rgba(0,0,0,0.72);
      backdrop-filter:blur(14px);
      border:1px solid rgba(0,255,170,0.3);
      border-radius:24px;
      padding:25px;
      margin-bottom:25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
    }

    .header-text h1{
      font-family:'Orbitron';
      color:#00ffb3;
      font-size:28px;
    }

    .nav a{
      color:#00ffb3;
      text-decoration:none;
      padding:12px 20px;
      border-radius:14px;
      border:1px solid rgba(0,255,170,0.2);
      background:rgba(255,255,255,0.03);
    }

    .nav a:hover{
      background:rgba(0,255,170,0.08);
    }

    .dashboard-grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:25px;
    }

    .card{
      background:rgba(0,0,0,0.72);
      backdrop-filter:blur(14px);
      border:1px solid rgba(0,255,170,0.3);
      border-radius:24px;
      padding:22px;
    }

    .card h2{
      font-family:'Orbitron';
      color:#00ffb3;
      margin-bottom:20px;
    }

    .live-feed video{
      width:100%;
      border-radius:18px;
      border:1px solid rgba(0,255,170,0.2);
      background:black;
    }

    .live-badge{
      position:absolute;
      top:22px;
      right:22px;
      background:#00ffb3;
      color:black;
      font-size:12px;
      font-weight:700;
      padding:8px 12px;
      border-radius:30px;
    }

    .live-feed{
      position:relative;
    }

    .status-box{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .status-item{
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(0,255,170,0.08);
    }

    .status-item h3{
      color:#00ffb3;
      font-size:14px;
    }

    .footer{
      margin-top:25px;
      text-align:center;
      color:#888;
      font-size:13px;
    }

    @media(max-width:1000px){
      .dashboard-grid{grid-template-columns:1fr;}
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="header-card">

    <div class="header-text">
      <h1>WELCOME, {{ current_user.username }}</h1>
      <div class="subtitle">Secure CCTV Monitoring Dashboard</div>
    </div>

    <div class="nav">
      <a href="/logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
      </a>
    </div>

  </div>

  <!-- Dashboard -->
  <div class="dashboard-grid">

    <!-- Live Feed -->
    <div class="card live-feed">

      <div class="live-badge">● LIVE</div>

      <h2>
        <i class="fa-solid fa-video"></i>
        LIVE CAMERA FEED
      </h2>

      <video autoplay muted controls playsinline>
        <source src="/stream_proxy/index.m3u8" type="application/x-mpegURL">
        Your browser does not support video playback.
      </video>

    </div>

    <!-- Status -->
    <div class="card">

      <h2>
        <i class="fa-solid fa-shield-halved"></i>
        SYSTEM STATUS
      </h2>

      <div class="status-box">

        <div class="status-item">
          <h3>CAMERA STATUS</h3>
          <p>Online</p>
        </div>

        <div class="status-item">
          <h3>LOGGED IN USER</h3>
          <p>{{ current_user.username }}</p>
        </div>

        <div class="status-item">
          <h3>ACCESS LEVEL</h3>
          <p>Standard User</p>
        </div>

        <div class="status-item">
          <h3>SYSTEM SECURITY</h3>
          <p>Protected & Active</p>
        </div>

      </div>

    </div>

  </div>

  <div class="footer">
    CCTV Monitoring System • User Access Panel
  </div>

</div>

</body>
</html>
