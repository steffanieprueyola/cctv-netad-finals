<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>CCTV System Login</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Inter',sans-serif;
      background:#050505;
      color:white;
      overflow:hidden;
      position:relative;
    }

    /* Background glow */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at 20% 30%, rgba(0,255,170,0.15), transparent 35%),
      radial-gradient(circle at 80% 70%, rgba(0,255,170,0.10), transparent 35%);
      z-index:0;
    }

    /* Grid overlay */
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background-image:
      linear-gradient(rgba(0,255,170,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,0.05) 1px, transparent 1px);
      background-size:45px 45px;
      z-index:0;
    }

    .container{
      width:100%;
      max-width:1100px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:60px;
      padding:40px;
      position:relative;
      z-index:2;
    }

    /* Login Card */
    .login-card{
      width:100%;
      max-width:430px;
      padding:30px;
      border-radius:24px;
      background:rgba(0,0,0,0.75);
      backdrop-filter:blur(16px);
      border:1px solid rgba(0,255,170,0.35);
      box-shadow:
      0 0 20px rgba(0,255,170,0.15),
      0 0 60px rgba(0,255,170,0.05);
    }

    .logo{
      text-align:center;
      margin-bottom:25px;
    }

    .shield{
      width:65px;
      height:65px;
      border:2px solid #00ffb3;
      border-radius:18px;
      transform:rotate(45deg);
      margin:0 auto 20px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .shield i{
      transform:rotate(-45deg);
      color:#00ffb3;
      font-size:22px;
    }

    h1{
      font-family:'Orbitron',sans-serif;
      font-size:24px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#00ffb3;
      font-size:13px;
      margin-bottom:15px;
    }

    .divider{
      width:60px;
      height:3px;
      background:#00ffb3;
      margin:0 auto;
      border-radius:50px;
    }

    /* Flash messages */
    .message{
      padding:12px;
      margin:20px 0;
      border-radius:10px;
      text-align:center;
      font-size:14px;
      background:rgba(255,0,0,0.08);
      border:1px solid rgba(255,0,0,0.2);
      color:#ff7b7b;
    }

    /* Inputs */
    .input-group{
      margin-bottom:18px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:12px;
      color:#00ffb3;
      font-family:'Orbitron';
      letter-spacing:1px;
    }

    .input-box{
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 15px;
      height:52px;
      border-radius:12px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      transition:.3s;
    }

    .input-box:focus-within{
      border-color:#00ffb3;
      box-shadow:0 0 10px rgba(0,255,170,0.15);
    }

    .input-box input{
      flex:1;
      background:none;
      border:none;
      outline:none;
      color:white;
      font-size:14px;
    }

    .icon{
      color:#00ffb3;
    }

    .eye{
      cursor:pointer;
    }

    /* Options */
    .options{
      display:flex;
      justify-content:space-between;
      margin-bottom:20px;
      font-size:13px;
    }

    .options a{
      color:#00ffb3;
      text-decoration:none;
    }

    input[type="checkbox"]{
      accent-color:#00ffb3;
    }

    /* Button */
    button{
      width:100%;
      height:52px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#00d97e,#00ffb3);
      font-family:'Orbitron';
      font-weight:700;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 0 20px rgba(0,255,170,0.3);
    }

    /* Side Text */
    .side-text{
      flex:1;
      text-align:center;
      font-family:'Orbitron';
      font-size:48px;
      color:#00ffb3;
      line-height:1.3;
      opacity:0.9;
    }

    @media(max-width:900px){
      .container{
        flex-direction:column;
      }

      .side-text{
        font-size:28px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="login-card">

    <div class="logo">
      <div class="shield">
        <i class="fa-solid fa-camera"></i>
      </div>

      <h1>CCTV LOGIN</h1>
      <div class="subtitle">Secure Surveillance Access</div>
      <div class="divider"></div>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">

      <div class="input-group">
        <label>USERNAME</label>
        <div class="input-box">
          <i class="fa-solid fa-user icon"></i>
          <input name="username" placeholder="Enter username" required>
        </div>
      </div>

      <div class="input-group">
        <label>PASSWORD</label>
        <div class="input-box">
          <i class="fa-solid fa-lock icon"></i>
          <input id="password" name="password" type="password" placeholder="Enter password" required>
          <i class="fa-regular fa-eye icon eye" id="togglePassword"></i>
        </div>
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit">
        LOGIN
      </button>

    </form>

    <p style="text-align:center; margin-top:18px; font-size:13px;">
      Don't have an account?
      <a href="/signup" style="color:#00ffb3;">Sign up</a>
    </p>

  </div>

  <div class="side-text">
    AUTHORIZED<br>PERSONNEL ONLY
  </div>

</div>

<script>
  const password = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  togglePassword.addEventListener("click", () => {
    if(password.type === "password"){
      password.type = "text";
      togglePassword.classList.replace("fa-eye","fa-eye-slash");
    } else {
      password.type = "password";
      togglePassword.classList.replace("fa-eye-slash","fa-eye");
    }
  });
</script>

</body>
</html>
