<!DOCTYPE html>
<html>
<head>
  <title>Sign Up — CCTV System</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px;
           margin: 80px auto; padding: 0 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0;
            box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #2563eb;
             color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: red; font-size: 14px; }
    .success { color: green; font-size: 14px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h2>Create Account</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="/signup">
    <input name="username" placeholder="Username" required minlength="3" maxlength="80">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password (min 8 chars)"
           required minlength="8">
    <input name="confirm_password" type="password" placeholder="Confirm Password" required>
    <button type="submit">Sign Up</button>
  </form>

  <p>Already have an account? <a href="/login">Log in</a></p>
</body>
</html>
